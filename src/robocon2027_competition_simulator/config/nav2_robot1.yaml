amcl:
  ros__parameters:
    use_sim_time: true

    # Frame
    global_frame_id: robot1/map
    odom_frame_id: robot1/odom
    base_frame_id: robot1/base_footprint

    # Sensor
    scan_topic: /robot1/scan
    map_topic: /robot1/map

    # AMCL
    tf_broadcast: true
    transform_tolerance: 0.5

    min_particles: 100   # Giam tu 500 xuong 100
    max_particles: 500  # Giam tu 2000 xuong 500
    max_beams: 60

    laser_model_type: likelihood_field
    laser_min_range: 0.1
    laser_max_range: 12.0

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    update_min_d: 0.10
    update_min_a: 0.10

    resample_interval: 1
map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: robot1/map
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: robot1/map
    robot_base_frame: robot1/base_footprint
    odom_topic: /robot1/diff_drive_controller/odom
    bt_loop_duration: 20          # Tăng từ 10 lên 50 (ms)
    default_server_timeout: 1000  # Tăng thời gian chờ server lên 1000ms (1 giây)
    wait_for_service_timeout: 5000
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "robot1/base_footprint"
    odom_frame_id: "robot1/odom"

    cmd_vel_in_topic: "/robot1/cmd_vel_smoothed"
    cmd_vel_out_topic: "/robot1/diff_drive_controller/cmd_vel"

    state_topic: "collision_monitor_state"

    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: False
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[[0.35, 0.30], [0.35, -0.30], [-0.35, -0.30], [-0.35, 0.30]]"
      action_type: "stop"
      min_points: 4
      visualize: True
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/robot1/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True
docking_server:
  ros__parameters:
    use_sim_time: True
    dock_plugins: ["simple_dock"]
    simple_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1      
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.55
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_frame: robot1/odom
    global_frame: robot1/map
    robot_base_frame: robot1/base_footprint
    transform_tolerance: 0.2
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    drive_on_heading: {plugin: nav2_behaviors::DriveOnHeading}
    wait: {plugin: nav2_behaviors::Wait}
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    cmd_vel_in_topic: /robot1/cmd_vel_nav
    cmd_vel_out_topic: /robot1/cmd_vel_smoothed
    max_velocity: [3.0, 0.0, 4.0]
    min_velocity: [-3.0, 0.0, -4.0]
    max_accel: [2.5, 0.0, 4.0]
    max_decel: [-2.5, 0.0, -4.0]
    odom_topic: /robot1/diff_drive_controller/odom
    velocity_timeout: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: robot1/odom
      robot_base_frame: robot1/base_footprint
      rolling_window: true
      resolution: 0.05
      robot_radius: 0.50
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot1/scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.1
          obstacle_max_range: 8.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: robot1/map
      robot_base_frame: robot1/base_footprint
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.50
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /robot1/map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot1/scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.1
          obstacle_max_range: 8.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [controller_server, planner_server, behavior_server, bt_navigator, waypoint_follower, velocity_smoother]

"/robot2/controller_manager":
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster: {type: joint_state_broadcaster/JointStateBroadcaster}
    diff_drive_controller: {type: diff_drive_controller/DiffDriveController}
    lift_position_controller: {type: forward_command_controller/ForwardCommandController}
    gripper_position_controller: {type: forward_command_controller/ForwardCommandController}

"/robot2/diff_drive_controller":
  ros__parameters:
    left_wheel_names: [robot2/left_front_wheel_joint, robot2/left_rear_wheel_joint]
    right_wheel_names: [robot2/right_front_wheel_joint, robot2/right_rear_wheel_joint]
    wheel_separation: 0.825
    wheel_radius: 0.075
    position_feedback: true
    open_loop: false
    use_stamped_vel: true
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    tf_frame_prefix_enable: true
    tf_frame_prefix: "" 
    enable_odom_tf: false

"/robot2/lift_position_controller":
  ros__parameters:
    joints: [robot2/lift_joint]
    interface_name: position

"/robot2/gripper_position_controller":
  ros__parameters:
    joints: [robot2/left_finger_joint, robot2/right_finger_joint]
    interface_name: position
